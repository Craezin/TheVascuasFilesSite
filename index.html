<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World Rejoices - Nick is Gone!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      width: 100vw;
      background-image: url('VascuasOver.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    .celebration-card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 90%;
      width: 550px;
      margin: 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffd700;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      line-height: 1.3;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 1rem;
    }

    .highlight {
      color: #72f2eb;
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="celebration-card">
    <h1>THE WORLD MAY REJOICE,<br>NICK IS GONE</h1>
    <p>A new era of peace has finally dawned. We are officially liberated from the dark reign of the gamer Nick and his relentless crimes against the server.</p>
    <p class="highlight">Freedom at last—the lobby is healed!</p>
  </div>

</body>
</html>
