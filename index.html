<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .background-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Stretches and fills the screen */
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #ffffff;
      padding: 2rem;
      max-width: 800px;
      background: rgba(0, 0, 0, 0.6); /* Semi-transparent overlay to ensure readable text */
      border-radius: 8px;
    }

    h1 {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="background-container">
    <img src="IMG_5250.jpeg" alt="Background" class="bg-image">
    <div class="content">
      <h1>ATTENTION</h1>
      <p>This site has been shut down after receiving a cease and desist from [REDACTED]</p>
    </div>
  </div>

</body>
</html>
