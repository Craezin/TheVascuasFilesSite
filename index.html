<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World Rejoices - Nick is Gone!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      width: 100vw;
      background-image: url('VascuasOver.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 2.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    .celebration-card {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      padding: 1.5rem 2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 90%;
      width: 650px;
      margin: 0 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffd700;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      line-height: 1.3;
    }

    p {
      font-size: 1rem;
      line-height: 1.5;
      color: #f0f0f0;
      margin-bottom: 0.5rem;
    }

    .highlight {
      color: #72f2eb;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="celebration-card">
    <h1>THE WORLD MAY REJOICE,<br>NICK IS GONE</h1>
    <p>A new era of peace has finally dawned. We are officially liberated from the dark reign of the gamer Nick and his relentless crimes against the server.</p>
    <p class="highlight">Freedom at last—the lobby is healed!</p>
  </div>

</body>
</html>
